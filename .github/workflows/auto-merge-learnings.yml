name: auto-merge-learnings

# 自主迭代：社区贡献零摩擦。
# 仅当 PR 只改动 learnings.md、且为「仅追加（不删改已有行）」、且不含密钥模式时，
# 由机器人自动合并；改动 SKILL.md 或含密钥的 PR 不自动合、留人审。
# 用 `gh pr diff`（API 拉取），对 fork PR 也能正确取到 diff。

on:
  pull_request:
    paths:
      - '.codebuddy/skills/pc-autopilot/learnings.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Validate append-only + no secrets
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          DIFF=$(gh pr diff "$PR_NUMBER")
          FILES=$(echo "$DIFF" | grep -E '^diff --git ' | sed -E 's#^diff --git a/.* b/(.*)$#\1#')
          echo "Changed files: $FILES"
          if [ "$FILES" != ".codebuddy/skills/pc-autopilot/learnings.md" ]; then
            echo "::error::PR changes files other than learnings.md; skipping auto-merge."
            exit 1
          fi
          DELS=$(echo "$DIFF" | grep -E '^-' | grep -v '^--- ' | grep -v '^diff --git ' | wc -l || true)
          if [ "$DELS" -gt 0 ]; then
            echo "::error::PR deletes/modifies existing lines; must be append-only; skipping auto-merge."
            exit 1
          fi
          if echo "$DIFF" | grep -Ei 'ghp_[a-z0-9]{16,}|github_pat_[a-z0-9]{16,}|AKIA[0-9A-Z]{16}|PRIVATE KEY|token[=:][A-Za-z0-9_]{16,}'; then
            echo "::error::PR contains suspicious secret patterns; skipping auto-merge."
            exit 1
          fi
          echo "OK: append-only and no secrets."

      - name: Auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
